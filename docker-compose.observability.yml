services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports: ["4317:4317", "4318:4318", "9464:9464"]
    depends_on: [tempo]
  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yaml:ro
    ports: ["3200:3200"]
  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus-rules.yaml:/etc/prometheus/rules/openagentflow.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    volumes:
      - ./deploy/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/openagentflow.yml:ro
    depends_on: [prometheus, tempo]
