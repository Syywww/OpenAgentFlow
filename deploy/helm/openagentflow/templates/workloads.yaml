{{- $root := . -}}
{{- range $name, $component := dict "api" .Values.api "document-worker" .Values.documentWorker "integration-worker" .Values.integrationWorker "runtime" .Values.runtime }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openagentflow-{{ $name }}
  labels: { app.kubernetes.io/name: openagentflow, app.kubernetes.io/component: {{ $name }} }
spec:
  replicas: {{ $component.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: openagentflow, app.kubernetes.io/component: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: openagentflow, app.kubernetes.io/component: {{ $name }} }
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: openagentflow, app.kubernetes.io/component: {{ $name }} }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: openagentflow, app.kubernetes.io/component: {{ $name }} }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: openagentflow, app.kubernetes.io/component: {{ $name }} }
      containers:
        - name: backend
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: {{ printf "%s,%s" $root.Values.config.profile (ternary "api" (ternary "runtime" "worker" (eq $name "runtime")) (eq $name "api")) | quote }} }
            - { name: OAF_KAFKA_BOOTSTRAP_SERVERS, value: {{ $root.Values.config.kafkaBootstrapServers | quote }} }
            - { name: OAF_KAFKA_CONSUMER_ENABLED, value: {{ ternary "false" "true" (or (eq $name "api") (eq $name "runtime")) | quote }} }
            - { name: OAF_KAFKA_PUBLISHER_ENABLED, value: {{ ternary "true" "false" (or (eq $name "api") (eq $name "runtime")) | quote }} }
            - { name: OAF_KAFKA_WORKER_ROLE, value: {{ ternary "document" (ternary "integration" "all" (eq $name "integration-worker")) (eq $name "document-worker") | quote }} }
          envFrom:
            - secretRef: { name: {{ $root.Values.secrets.existingSecret }} }
          readinessProbe:
            httpGet: { path: /api/actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/actuator/health/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          lifecycle:
            preStop: { exec: { command: ["sh", "-c", "sleep 15"] } }
          resources:
{{ toYaml ($component.resources | default $root.Values.api.resources) | indent 12 }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: openagentflow-api }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: openagentflow, app.kubernetes.io/component: api }
---
apiVersion: v1
kind: Service
metadata: { name: openagentflow-api }
spec:
  selector: { app.kubernetes.io/name: openagentflow, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: openagentflow-runtime }
spec:
  selector: { app.kubernetes.io/name: openagentflow, app.kubernetes.io/component: runtime }
  ports: [{ name: http, port: 8080, targetPort: http }]
