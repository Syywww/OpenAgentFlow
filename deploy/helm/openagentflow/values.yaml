image:
  repository: openagentflow-backend
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 2
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }

documentWorker:
  replicas: 2
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "4", memory: 6Gi }

integrationWorker:
  replicas: 2

runtime:
  replicas: 2

config:
  profile: prod
  kafkaBootstrapServers: kafka:9092
  workerTopic: openagentflow.async-task.document

secrets:
  existingSecret: openagentflow-secrets

autoscaling:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 30
  lagThreshold: "100"

ingress:
  enabled: false
  className: nginx
  host: openagentflow.example.com
