global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: openagentflow
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: [openagentflow-backend:8080]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
