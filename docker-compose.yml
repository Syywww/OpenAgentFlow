services:
  mysql:
    image: mysql:8.4
    container_name: openagentflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OAF_MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${OAF_MYSQL_DATABASE:-openagentflow}
      TZ: Asia/Shanghai
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Docker Desktop 挂载 Windows 文件默认 777 权限，MySQL 会忽略 world-writable 的配置文件。
        # 因此不用 bind mount 的 client.cnf，改为直接在镜像内的 /etc/my.cnf 追加 [client] 配置。
        # 镜像内文件权限固定 644，永远生效，避免 initdb 客户端以 latin1 解码 UTF-8 中文导致乱码。
        grep -q 'default-character-set=utf8mb4' /etc/my.cnf || printf '\n[client]\ndefault-character-set=utf8mb4\n' >> /etc/my.cnf
        exec docker-entrypoint.sh "$@"
      - docker-entrypoint.sh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${OAF_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./openagentflow-sql/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: openagentflow-redis
    restart: unless-stopped
    ports:
      - "${OAF_REDIS_PORT_PUBLIC:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: bitnamilegacy/kafka:3.8
    container_name: openagentflow-kafka
    restart: unless-stopped
    environment:
      # KRaft 单节点，无需 Zookeeper。
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${OAF_KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: openagentflow-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: openagentflow-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: ${OAF_MINIO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${OAF_MINIO_PORT:-9000}:9000"
      - "${OAF_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.6
    container_name: openagentflow-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${OAF_MILVUS_PORT_PUBLIC:-19530}:19530"
      - "${OAF_MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started

  backend:
    build:
      context: ./openagentflow-backend
    container_name: openagentflow-backend
    restart: unless-stopped
    environment:
      OAF_MYSQL_URL: ${OAF_MYSQL_URL:-jdbc:mysql://mysql:3306/openagentflow?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      OAF_MYSQL_USERNAME: ${OAF_MYSQL_USERNAME:-root}
      OAF_MYSQL_PASSWORD: ${OAF_MYSQL_PASSWORD:-123456}
      OAF_REDIS_HOST: redis
      OAF_REDIS_PORT: 6379
      OAF_REDIS_DATABASE: ${OAF_REDIS_DATABASE:-0}
      OAF_KAFKA_BOOTSTRAP_SERVERS: ${OAF_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      OAF_KAFKA_CONSUMER_GROUP: ${OAF_KAFKA_CONSUMER_GROUP:-openagentflow-async-workers}
      OAF_KAFKA_CONCURRENCY: ${OAF_KAFKA_CONCURRENCY:-4}
      OAF_KAFKA_TASK_ENABLED: ${OAF_KAFKA_TASK_ENABLED:-true}
      OAF_KAFKA_TASK_TOPIC: ${OAF_KAFKA_TASK_TOPIC:-openagentflow.async-task}
      OAF_KAFKA_RETRY_TOPIC_5S: ${OAF_KAFKA_RETRY_TOPIC_5S:-openagentflow.async-task.retry-5s}
      OAF_KAFKA_RETRY_TOPIC_30S: ${OAF_KAFKA_RETRY_TOPIC_30S:-openagentflow.async-task.retry-30s}
      OAF_KAFKA_DLT_TOPIC: ${OAF_KAFKA_DLT_TOPIC:-openagentflow.async-task.dlt}
      OAF_KAFKA_TASK_PARTITIONS: ${OAF_KAFKA_TASK_PARTITIONS:-6}
      OAF_KAFKA_REPLICATION_FACTOR: ${OAF_KAFKA_REPLICATION_FACTOR:-1}
      OAF_KAFKA_MIN_INSYNC_REPLICAS: ${OAF_KAFKA_MIN_INSYNC_REPLICAS:-1}
      OAF_KAFKA_TASK_MAX_RETRIES: ${OAF_KAFKA_TASK_MAX_RETRIES:-3}
      OAF_KAFKA_TASK_STALE_SECONDS: ${OAF_KAFKA_TASK_STALE_SECONDS:-300}
      OAF_KAFKA_OUTBOX_BATCH_SIZE: ${OAF_KAFKA_OUTBOX_BATCH_SIZE:-100}
      OAF_KAFKA_OUTBOX_MAX_ATTEMPTS: ${OAF_KAFKA_OUTBOX_MAX_ATTEMPTS:-20}
      OAF_KAFKA_OUTBOX_RETENTION_DAYS: ${OAF_KAFKA_OUTBOX_RETENTION_DAYS:-7}
      OAF_KAFKA_OUTBOX_POLL_MS: ${OAF_KAFKA_OUTBOX_POLL_MS:-500}
      OAF_KAFKA_WORKER_ROLE: ${OAF_KAFKA_WORKER_ROLE:-all}
      OAF_KAFKA_CONSUMER_ENABLED: ${OAF_KAFKA_CONSUMER_ENABLED:-true}
      OAF_KAFKA_PUBLISHER_ENABLED: ${OAF_KAFKA_PUBLISHER_ENABLED:-true}
      OAF_KAFKA_MAX_RUNNING_TASKS: ${OAF_KAFKA_MAX_RUNNING_TASKS:-32}
      OAF_EMBEDDING_QPS: ${OAF_EMBEDDING_QPS:-8}
      OAF_EMBEDDING_CONCURRENCY: ${OAF_EMBEDDING_CONCURRENCY:-4}
      OAF_EMBEDDING_ACQUIRE_TIMEOUT_MS: ${OAF_EMBEDDING_ACQUIRE_TIMEOUT_MS:-10000}
      OAF_ALLOW_LOCAL_EMBEDDING_FALLBACK: ${OAF_ALLOW_LOCAL_EMBEDDING_FALLBACK:-true}
      OAF_OBJECT_STORAGE_ENABLED: ${OAF_OBJECT_STORAGE_ENABLED:-true}
      OAF_MINIO_ENDPOINT: http://minio:9000
      OAF_MINIO_PUBLIC_ENDPOINT: ${OAF_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      OAF_MINIO_ACCESS_KEY: ${OAF_MINIO_ACCESS_KEY:-minioadmin}
      OAF_MINIO_SECRET_KEY: ${OAF_MINIO_SECRET_KEY:-minioadmin}
      OAF_MINIO_BUCKET: ${OAF_MINIO_BUCKET:-openagentflow}
      OAF_MILVUS_HOST: milvus
      OAF_MILVUS_PORT: 19530
      OAF_MILVUS_DATABASE: ${OAF_MILVUS_DATABASE:-default}
      OAF_JWT_SECRET: ${OAF_JWT_SECRET:-please-change-this-secret-before-production}
      OAF_JWT_EXPIRE_MINUTES: ${OAF_JWT_EXPIRE_MINUTES:-1440}
      TZ: Asia/Shanghai
    ports:
      - "${OAF_BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      milvus:
        condition: service_started
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./openagentflow-frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: openagentflow-frontend
    restart: unless-stopped
    ports:
      - "${OAF_FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  etcd-data:
  minio-data:
  milvus-data:
