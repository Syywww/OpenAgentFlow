services:
  mysql:
    image: mysql:8.4
    container_name: openagentflow-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OAF_MYSQL_ROOT_PASSWORD:?请配置强 MySQL root 密码}
      MYSQL_DATABASE: ${OAF_MYSQL_DATABASE:-openagentflow}
      MYSQL_USER: ${OAF_MYSQL_USERNAME:-openagentflow}
      MYSQL_PASSWORD: ${OAF_MYSQL_PASSWORD:?请配置业务库密码}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=500
    volumes:
      - mysql-data:/var/lib/mysql
      - ./openagentflow-sql/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"

  redis:
    image: redis:7.4-alpine
    container_name: openagentflow-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${OAF_REDIS_PASSWORD:?请配置 Redis 密码}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${OAF_REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: openagentflow-etcd-prod
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:latest
    container_name: openagentflow-minio-prod
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${OAF_MINIO_ROOT_USER:?请配置 MinIO 用户}
      MINIO_ROOT_PASSWORD: ${OAF_MINIO_ROOT_PASSWORD:?请配置 MinIO 密码}
    command: minio server /minio_data
    volumes:
      - minio-data:/minio_data
    security_opt:
      - no-new-privileges:true

  milvus:
    image: milvusdb/milvus:v2.4.6
    container_name: openagentflow-milvus-prod
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./openagentflow-backend
    image: openagentflow-backend:${OAF_IMAGE_TAG:-prod}
    container_name: openagentflow-backend-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OAF_MYSQL_URL: jdbc:mysql://mysql:3306/${OAF_MYSQL_DATABASE:-openagentflow}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      OAF_MYSQL_USERNAME: ${OAF_MYSQL_USERNAME:-openagentflow}
      OAF_MYSQL_PASSWORD: ${OAF_MYSQL_PASSWORD:?请配置业务库密码}
      OAF_REDIS_HOST: redis
      OAF_REDIS_PORT: 6379
      OAF_REDIS_DATABASE: ${OAF_REDIS_DATABASE:-0}
      OAF_REDIS_PASSWORD: ${OAF_REDIS_PASSWORD:?请配置 Redis 密码}
      OAF_MILVUS_HOST: milvus
      OAF_MILVUS_PORT: 19530
      OAF_MILVUS_DATABASE: ${OAF_MILVUS_DATABASE:-default}
      OAF_JWT_SECRET: ${OAF_JWT_SECRET:?请配置长度不少于 32 位的 JWT 密钥}
      OAF_JWT_EXPIRE_MINUTES: ${OAF_JWT_EXPIRE_MINUTES:-720}
      OAF_CORS_ALLOWED_ORIGINS: ${OAF_CORS_ALLOWED_ORIGINS:?请配置生产前端域名}
      JAVA_OPTS: ${OAF_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      TZ: Asia/Shanghai
    volumes:
      - backend-data:/app/data
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 40
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OAF_BACKEND_MEM_LIMIT:-2g}
    cpus: ${OAF_BACKEND_CPUS:-2}
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"

  frontend:
    build:
      context: ./openagentflow-frontend
      args:
        VITE_API_BASE_URL: /api
    image: openagentflow-frontend:${OAF_IMAGE_TAG:-prod}
    container_name: openagentflow-frontend-prod
    restart: unless-stopped
    ports:
      - "${OAF_HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OAF_FRONTEND_MEM_LIMIT:-256m}
    cpus: ${OAF_FRONTEND_CPUS:-0.5}
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  backend-data:
