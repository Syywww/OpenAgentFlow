name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openagentflow-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check Flyway migration copies
        shell: pwsh
        working-directory: .
        run: ./scripts/sync-flyway-migrations.ps1 -Check

      - name: Check Docker engine
        working-directory: .
        run: docker info

      - name: Test backend and enforce coverage
        run: mvn -B verify

      - name: Ensure MySQL container suites executed
        shell: bash
        run: |
          reports=(
            "target/surefire-reports/TEST-com.openagentflow.FlywayMigrationTests.xml"
            "target/surefire-reports/TEST-com.openagentflow.InfrastructureContainerSmokeTests.xml"
            "target/surefire-reports/TEST-com.openagentflow.service.SolutionTemplateServiceTests.xml"
            "target/surefire-reports/TEST-com.openagentflow.service.TemplateInstallServiceTests.xml"
            "target/surefire-reports/TEST-com.openagentflow.service.PermissionGovernanceServiceTests.xml"
          )
          for report in "${reports[@]}"; do
            test -f "$report" || { echo "Missing test report: $report"; exit 1; }
            grep -q 'skipped="0"' "$report" || { echo "Container suite was skipped: $report"; exit 1; }
          done

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openagentflow-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openagentflow-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
