spring:
  datasource:
    hikari:
      maximum-pool-size: ${OAF_DB_POOL_MAX_SIZE:30}
      minimum-idle: ${OAF_DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
  data:
    redis:
      timeout: ${OAF_REDIS_TIMEOUT:5s}

management:
  tracing:
    # 生产环境默认启用OTLP，由部署配置提供Collector地址。
    enabled: ${OAF_TRACING_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: ${OAF_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${OAF_SWAGGER_ENABLED:false}

server:
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${OAF_TOMCAT_MAX_THREADS:200}
      min-spare: ${OAF_TOMCAT_MIN_SPARE_THREADS:20}
    connection-timeout: ${OAF_TOMCAT_CONNECTION_TIMEOUT:20s}
    max-connections: ${OAF_TOMCAT_MAX_CONNECTIONS:8192}

openagentflow:
  tenancy:
    require-workspace-context: ${OAF_REQUIRE_WORKSPACE_CONTEXT:true}
  runtime:
    executor:
      core-size: ${OAF_RUNTIME_CORE_SIZE:32}
      max-size: ${OAF_RUNTIME_MAX_SIZE:128}
      queue-capacity: ${OAF_RUNTIME_QUEUE_CAPACITY:500}
  vector-store:
    strict-write: ${OAF_VECTOR_STRICT_WRITE:true}
  observability:
    refresh-ms: ${OAF_METRICS_REFRESH_MS:15000}
  async-task:
    enabled: true
    replication-factor: ${OAF_KAFKA_REPLICATION_FACTOR:3}
    min-in-sync-replicas: ${OAF_KAFKA_MIN_INSYNC_REPLICAS:2}
  object-storage:
    enabled: true
  rag:
    allow-local-embedding-fallback: ${OAF_ALLOW_LOCAL_EMBEDDING_FALLBACK:false}
    allow-mysql-vector-fallback: ${OAF_ALLOW_MYSQL_VECTOR_FALLBACK:false}
  security:
    allowed-origins: ${OAF_CORS_ALLOWED_ORIGINS}
    permission-strict-mode: ${OAF_PERMISSION_STRICT_MODE:true}
