spring:
  datasource:
    hikari:
      maximum-pool-size: ${OAF_DB_POOL_MAX_SIZE:30}
      minimum-idle: ${OAF_DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
  data:
    redis:
      timeout: ${OAF_REDIS_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: ${OAF_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${OAF_SWAGGER_ENABLED:false}

server:
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${OAF_TOMCAT_MAX_THREADS:200}
      min-spare: ${OAF_TOMCAT_MIN_SPARE_THREADS:20}
    connection-timeout: ${OAF_TOMCAT_CONNECTION_TIMEOUT:20s}
    max-connections: ${OAF_TOMCAT_MAX_CONNECTIONS:8192}

openagentflow:
  async-task:
    enabled: true
  object-storage:
    enabled: true
  security:
    allowed-origins: ${OAF_CORS_ALLOWED_ORIGINS}
