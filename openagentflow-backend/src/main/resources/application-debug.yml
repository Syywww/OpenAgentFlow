# IDEA Debug 专用配置。
# 使用方式：在 IDEA Run/Debug Configuration 的 Active profiles 中填写 debug。
logging:
  level:
    root: INFO
    com.openagentflow: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.baomidou.mybatisplus: INFO
    org.mybatis: INFO
    org.springframework.jdbc: INFO

spring:
  main:
    banner-mode: console

management:
  endpoint:
    health:
      show-details: always
