# IDEA Debug 专用配置。
# 使用方式：在 IDEA Run/Debug Configuration 的 Active profiles 中填写 debug。
logging:
  level:
    root: INFO
    com.openagentflow: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.baomidou.mybatisplus: INFO
    org.mybatis: INFO
    org.springframework.jdbc: INFO
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: WARN
    com.openagentflow.database: INFO
    com.openagentflow.http.access: INFO

spring:
  main:
    banner-mode: off

management:
  endpoint:
    health:
      show-details: always
